appId: com.yourcompany.spreadsheetgrapher
productName: Spreadsheet Grapher

directories:
  output: release
  buildResources: resources

# Everything is bundled by Vite, so only the build output ships.
files:
  - dist/**
  - dist-electron/**
  - package.json

asar: true

win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office